# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-recommender"
version = "0.1.0"
description = "A hybrid recommendation engine for GitHub repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "joblib",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
collaborative = [
    "implicit",
]

dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
